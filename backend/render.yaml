services:
  - type: web
    name: tomato-disease-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: tomato-disease-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: tomato-disease-models
      - key: HF_SPACE_URL
        sync: false
    
databases:
  - name: tomato-disease-db
    databaseName: tomato_disease
    user: app_user
