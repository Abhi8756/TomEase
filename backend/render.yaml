services:
  - type: web
    name: tomease-api
    env: python
    region: singapore          # Closest to India
    plan: free
    rootDir: .                 # Render root = backend/ (set in dashboard)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production
      # ── Model: auto-download from Google Drive on cold start ──
      - key: MODEL_GDRIVE_ID
        value: "1tOJLCsnL0W4un45cXXNRLmGVMUEDHYmq"
      # ── Auth secrets (generate a real one in the Render dashboard) ──
      - key: JWT_SECRET_KEY
        generateValue: true
      # ── Groq LLM (optional — fallback works without it) ──
      - key: GROQ_API_KEY
        sync: false
      # ── Database: leave blank → SQLite (upgrade to Postgres anytime) ──
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: tomease-db
      #     property: connectionString
